[project]
name = "mcp-postgres"
version = "0.1.0"
description = "MCP tool server — read-only PostgreSQL access for AI agents"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.1.1",
    "uvicorn>=0.52.4",
    "starlette>=1.6.0",
    "psycopg[binary]>=3.3.5",
    "structlog>=26.1.0",
    # Real PostgreSQL parsing for the table allow-list. A regex cannot do this job — see the
    # module docstring in src/mcp_postgres/table_extraction.py.
    "sqlglot>=30.17.0",
    # Per-caller authentication and authorization. Resolved from PyPI, deliberately: a
    # `[tool.uv.sources]` path to a sibling checkout works locally but not in the Docker
    # build, whose context is this directory alone.
    #
    # >=0.9.0 is a floor, not a preference, and each step of it is load-bearing here.
    #
    # 0.6.1 sends `User-Agent: mcp-policy-guard/<version>` to the PDP, and the platform reads
    # that header to stamp `Tool.policyGuardVersion` — which is what moves this tool's row on
    # the Enforcement Coverage panel off "Never checked in". A guard reporting no version is
    # treated as too old to be handed a row predicate at all.
    #
    # 0.8.0 adds `report_not_evaluated`, without which a call that fails *before* policy can
    # evaluate reaches the platform as nothing at all — no `/evaluate`, no audit row — and a
    # tool failing that way is indistinguishable from one nobody has called.
    #
    # 0.9.0 adds `scope_notice`. Row scoping is otherwise invisible: the predicate is applied
    # by rewriting the query, so a caller asking about rows they hold no entitlement for gets
    # a valid query, zero rows and no reason, and the model invents a cause — observed on
    # 2026-09-08 as an assistant telling a user the database replica was incomplete.
    #
    # Raising this floor requires `uv lock --refresh-package mcp-policy-guard`. CI runs
    # `uv sync --frozen`, which does NOT check the lock against this file, so a raised floor
    # with a stale lock is a green-looking commit that installs the old version.
    "mcp-policy-guard>=0.9.0",
]

[project.scripts]
mcp-postgres = "mcp_postgres.server:main"

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_postgres"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "W", "I"]
